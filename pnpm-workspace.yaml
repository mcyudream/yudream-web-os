  '@stylistic/stylelint-config': ^5.0.0
  '@types/node': ^26.6.4
  '@unocss/eslint-plugin': ^66.10.5
  '@vitejs/plugin-vue': ^6.0.9
  bumpp: ^12.3.0
  clsx: ^2.1.1
  cz-git: ^1.14.0
  es-toolkit: ^1.52.0
  eslint: ^10.12.0
  happy-dom: ^20.14.5
  lint-staged: ^17.6.0
  npm-run-all2: ^9.0.3
  pinia: ^4.0.3
  simple-git-hooks: ^2.14.0
  stylelint: ^17.16.0
  stylelint-config-recess-order: ^7.8.0
  stylelint-config-standard-scss: ^17.0.0
  stylelint-config-standard-vue: ^2.0.0
